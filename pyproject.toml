[project]
name = "quadruped-walking"
version = "0.1.0"
description = "Sim-to-real RL for a Unitree Go2 quadruped: mjlab + rsl_rl PPO, verified in Drake."
requires-python = ">=3.12,<3.14"
dependencies = [
    "drake==1.56.0",
    "mjlab==1.6.0",
    "mujoco==3.11.0",
    "numpy==2.5.2",
    "onnx==1.21.0",
    "onnxruntime-gpu==1.26.0",
    "torch==2.12.0",
]
